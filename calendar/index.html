<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendar — Ananel Coval</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#005500;--pink:#D4007E;--bg:#f7f5f6;
    --text:#171717;--muted:#8c898b;--line:#e4e0e3;
    --sole:#f5e4eb;--extra:#e6eee9;--hog:#eee8f3
}
*{box-sizing:border-box}
body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Montserrat',sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.page{max-width:1450px;margin:auto;padding:24px}

/* HEADER */

.header{
    padding:22px 30px;background:#fff;border:1px solid var(--line);
    border-radius:18px;display:flex;justify-content:space-between;align-items:center
}
.brand{display:flex;align-items:baseline;gap:14px}
.logo{margin:0;color:var(--green);font-size:30px}
.label{
    color:#aaa;font-size:10px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase
}
.back{color:#999;font-size:12px;font-weight:600;text-decoration:none}
.back:hover{color:var(--pink)}

/* TOP */

.top{
    margin:55px 0 28px;
    display:flex;justify-content:space-between;align-items:end
}
.top h2{margin:0;color:var(--green);font-size:38px}
.top p{margin:8px 0 0;color:var(--muted);font-size:13px}

.add{
    padding:12px 18px;border:0;border-radius:10px;
    background:var(--green);color:#fff;font-weight:600
}
.add:hover{background:var(--pink)}

/* TABS */

.tabs{
    margin-bottom:20px;padding:5px;background:#ece9eb;
    border-radius:12px;display:inline-flex;gap:3px
}
.tab{
    padding:10px 17px;border:0;border-radius:9px;
    background:transparent;color:#777;font-size:12px;font-weight:600
}
.tab.active{
    background:#fff;color:var(--green);
    box-shadow:0 2px 8px rgba(0,0,0,.04)
}

/* CALENDAR HEADER */

.calendar-box{
    background:#fff;border:1px solid var(--line);
    border-radius:18px;overflow:hidden
}
.calendar-head{
    padding:22px 25px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center
}
.month-title{font-size:20px;font-weight:700}
.month-nav{display:flex;align-items:center;gap:7px}
.month-nav button{
    width:34px;height:34px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:#777;font-size:17px
}
.month-nav button:hover{border-color:var(--pink);color:var(--pink)}

.today{
    width:auto!important;padding:0 12px;
    font-size:11px!important;font-weight:600
}

/* GRID */

.weekdays,.calendar-grid{
    display:grid;grid-template-columns:repeat(7,1fr)
}
.weekdays{
    border-bottom:1px solid var(--line)
}
.weekday{
    padding:12px;text-align:center;color:#aaa;
    font-size:10px;font-weight:700;letter-spacing:1px
}

.day{
    position:relative;min-height:135px;padding:10px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:#fff
}
.day:nth-child(7n){border-right:0}
.day.other{background:#fafafa;color:#bbb}

.day-number{
    width:27px;height:27px;display:flex;
    align-items:center;justify-content:center;
    border-radius:50%;font-size:12px;font-weight:600
}
.day.today .day-number{
    background:var(--pink);color:#fff
}

/* EVENTS */

.day-events{
    margin-top:7px;display:flex;flex-direction:column;gap:4px
}
.event{
    padding:6px 7px;border-radius:6px;
    font-size:10px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer
}
.event.sole{background:var(--sole);color:#754557}
.event.extra{background:var(--extra);color:#456354}
.event.hogwarts{background:var(--hog);color:#604c70}

.more{
    padding:3px 5px;color:#999;font-size:9px;font-weight:600
}

/* OVERVIEW */

.overview{
    display:none;padding:28px
}
.overview.open{display:block}

.overview-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px
}
.overview-card{
    padding:20px;border:1px solid var(--line);
    border-radius:14px;background:#fff
}
.overview-card h3{margin:0 0 5px;font-size:15px}
.overview-date{color:#999;font-size:10px}
.overview-tags{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.tag{
    padding:5px 8px;border-radius:20px;
    background:#f4f1f3;color:#777;font-size:9px;font-weight:600
}

/* MODAL */

.modal{
    display:none;position:fixed;inset:0;z-index:1000;
    padding:25px;background:rgba(20,20,20,.4);
    align-items:center;justify-content:center
}
.modal.open{display:flex}

.modal-box{
    width:min(600px,100%);max-height:90vh;overflow:auto;
    padding:28px;background:#fff;border-radius:18px;
    box-shadow:0 25px 80px rgba(0,0,0,.18)
}
.modal-head{
    margin-bottom:22px;display:flex;
    justify-content:space-between;align-items:center
}
.modal-head h3{margin:0;color:var(--green);font-size:22px}
.close{border:0;background:none;color:#aaa;font-size:24px}

.form-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:16px
}
.field{display:flex;flex-direction:column;gap:6px}
.full{grid-column:1/-1}

label{
    color:#777;font-size:10px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase
}
input,select,textarea{
    width:100%;padding:11px 12px;border:1px solid #d9d5d8;
    border-radius:9px;background:#fff
}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--pink)
}

.actions{
    margin-top:20px;display:flex;justify-content:flex-end;gap:8px
}
.save,.delete{
    padding:10px 15px;border-radius:9px;font-weight:600
}
.save{border:0;background:var(--pink);color:#fff}
.delete{
    display:none;border:1px solid #ddd;background:#fff;color:#999
}
.delete.visible{display:block}

/* EVENT DETAILS */

.details{
    display:none;margin-top:20px;padding:18px;
    background:#faf8f9;border-radius:12px
}
.details.open{display:block}
.details-title{
    margin-bottom:12px;color:#999;font-size:10px;
    font-weight:700;letter-spacing:1px;text-transform:uppercase
}

.idea-row{
    padding:10px 0;border-top:1px solid #eee;
    display:flex;justify-content:space-between;gap:15px
}
.idea-row:first-of-type{border-top:0}
.idea-shop{font-size:12px;font-weight:700;color:var(--green)}
.idea-status{font-size:11px;color:#888}

/* MOBILE */

@media(max-width:800px){
    .page{padding:12px}
    .day{min-height:100px;padding:6px}
    .event{font-size:8px;padding:5px}
    .overview-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="page">

<header class="header">
    <div class="brand">
        <h1 class="logo">Ananel Coval</h1>
        <span class="label">Calendar</span>
    </div>
    <a class="back" href="../">← Workspace</a>
</header>

<div class="top">
    <div>
        <h2>Календарь</h2>
        <p>События, выпуски и планы</p>
    </div>
    <button class="add" onclick="openNewEvent()">+ Событие</button>
</div>

<nav class="tabs">
    <button class="tab active" data-view="sole">SÓLE</button>
    <button class="tab" data-view="extra">EXTRA</button>
    <button class="tab" data-view="hogwarts">Хогвартс</button>
    <button class="tab" data-view="overview">Обзор</button>
</nav>

<div class="calendar-box">

    <div class="calendar-head">
        <div id="month-title" class="month-title"></div>

        <div class="month-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button class="today" onclick="goToday()">Сегодня</button>
            <button onclick="changeMonth(1)">›</button>
        </div>
    </div>

    <div id="calendar-view">
        <div class="weekdays">
            <div class="weekday">ПН</div>
            <div class="weekday">ВТ</div>
            <div class="weekday">СР</div>
            <div class="weekday">ЧТ</div>
            <div class="weekday">ПТ</div>
            <div class="weekday">СБ</div>
            <div class="weekday">ВС</div>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <div id="overview" class="overview">
        <div id="overview-grid" class="overview-grid"></div>
    </div>

</div>

</div>

<!-- EVENT MODAL -->

<div id="event-modal" class="modal">
<div class="modal-box">

    <div class="modal-head">
        <h3 id="modal-title">Новое событие</h3>
        <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="form-grid">

        <div class="field full">
            <label>Название</label>
            <input id="event-name" placeholder="Сезонная осень">
        </div>

        <div class="field">
            <label>Раздел</label>
            <select id="event-category">
                <option value="sole">SÓLE</option>
                <option value="extra">EXTRA</option>
                <option value="hogwarts">Хогвартс</option>
            </select>
        </div>

        <div class="field">
            <label>Статус</label>
            <select id="event-status">
                <option>Не решено</option>
                <option>Запланировано</option>
                <option>В работе</option>
                <option>Выпущено</option>
                <option>Пропускаю</option>
            </select>
        </div>

        <div class="field">
            <label>Начало</label>
            <input id="event-start" type="date">
        </div>

        <div class="field">
            <label>Конец</label>
            <input id="event-end" type="date">
        </div>

        <div class="field full">
            <label>Пометка</label>
            <textarea id="event-note" placeholder="Что нужно сделать, идея, детали..."></textarea>
        </div>

    </div>

    <div id="hogwarts-details" class="details">
        <div class="details-title">Решения по магазинам</div>

        <div class="idea-row">
            <span class="idea-shop">SÓLE</span>
            <select id="sole-decision">
                <option>Не решено</option>
                <option>Запланировано</option>
                <option>Пропускаю</option>
                <option>Выпущено</option>
            </select>
        </div>

        <div class="idea-row">
            <span class="idea-shop">EXTRA</span>
            <select id="extra-decision">
                <option>Не решено</option>
                <option>Запланировано</option>
                <option>Пропускаю</option>
                <option>Выпущено</option>
            </select>
        </div>
    </div>

    <div class="actions">
        <button id="delete-event" class="delete" onclick="deleteEvent()">Удалить</button>
        <button class="save" onclick="saveEvent()">Сохранить</button>
    </div>

</div>
</div>

<script src="../data/calendar.js"></script>

<script>
const $=id=>document.getElementById(id);
const MONTHS=[
    "Январь","Февраль","Март","Апрель","Май","Июнь",
    "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
];

let view="sole";
let current=new Date();
let editingId=null;

let customEvents=
    JSON.parse(localStorage.getItem("ananelCalendar"))||[];

const baseEvents=(window.CALENDAR_DATA?.hogwarts||[]).map(e=>({
    ...e,
    category:"hogwarts",
    status:"Не решено",
    locked:true
}));

/* EVENTS */

function allEvents(){
    return [...baseEvents,...customEvents];
}

function saveLocal(){
    localStorage.setItem("ananelCalendar",JSON.stringify(customEvents));
}

/* TABS */

document.querySelectorAll(".tab").forEach(tab=>{
    tab.onclick=()=>{
        document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
        tab.classList.add("active");
        view=tab.dataset.view;
        render();
    };
});

/* MONTH */

function changeMonth(amount){
    current=new Date(current.getFullYear(),current.getMonth()+amount,1);
    render();
}

function goToday(){
    current=new Date();
    render();
}

/* RENDER */

function render(){
    $("month-title").textContent=
        `${MONTHS[current.getMonth()]} ${current.getFullYear()}`;

    const overview=view==="overview";

    $("calendar-view").style.display=overview?"none":"block";
    $("overview").classList.toggle("open",overview);

    overview?renderOverview():renderCalendar();
}

function renderCalendar(){
    const grid=$("calendar-grid");
    grid.innerHTML="";

    const year=current.getFullYear();
    const month=current.getMonth();

    const first=new Date(year,month,1);
    const startOffset=(first.getDay()+6)%7;
    const start=new Date(year,month,1-startOffset);

    for(let i=0;i<42;i++){
        const date=new Date(start);
        date.setDate(start.getDate()+i);

        const iso=toISO(date);
        const today=iso===toISO(new Date());

        const events=allEvents()
            .filter(e=>
                e.category===view &&
                iso>=e.start &&
                iso<=e.end
            );

        const day=document.createElement("div");
        day.className=
            "day"+
            (date.getMonth()!==month?" other":"")+
            (today?" today":"");

        day.onclick=e=>{
            if(e.target.closest(".event"))return;
            openNewEvent(iso);
        };

        day.innerHTML=`
            <div class="day-number">${date.getDate()}</div>
            <div class="day-events">
                ${events.slice(0,3).map(e=>`
                    <div class="event ${e.category}"
                         onclick="openEvent('${e.id}')">
                        ${e.name}
                    </div>
                `).join("")}
                ${events.length>3
                    ?`<div class="more">+ ещё ${events.length-3}</div>`
                    :""}
            </div>
        `;

        grid.appendChild(day);
    }
}

/* OVERVIEW */

function renderOverview(){
    const start=toISO(new Date(current.getFullYear(),current.getMonth(),1));
    const end=toISO(new Date(current.getFullYear(),current.getMonth()+1,0));

    const events=allEvents()
        .filter(e=>e.end>=start&&e.start<=end)
        .sort((a,b)=>a.start.localeCompare(b.start));

    $("overview-grid").innerHTML=events.length
$("overview-grid").innerHTML=events.length
    ?events.map(e=>`
        <div class="overview-card" onclick="openEvent('${e.id}')">
            <h3>${e.name}</h3>

            <div class="overview-date">
                ${formatDate(e.start)}
                ${e.end!==e.start?" — "+formatDate(e.end):""}
            </div>

            <div class="overview-tags">
                <span class="tag">
                    ${categoryName(e.category)}
                </span>

                <span class="tag">
                    ${e.status||"Не решено"}
                </span>

                ${e.category==="hogwarts"?`
                    <span class="tag">
                        SÓLE: ${e.soleDecision||"Не решено"}
                    </span>

                    <span class="tag">
                        EXTRA: ${e.extraDecision||"Не решено"}
                    </span>
                `:""}
            </div>
        </div>
    `).join("")
    :`
        <div class="empty">
            На этот месяц событий нет.
        </div>
    `;
}


/* =========================
   НОВОЕ СОБЫТИЕ
========================= */

function openNewEvent(date){
    editingId=null;

    $("modal-title").textContent="Новое событие";

    $("event-name").value="";
    $("event-category").value=
        view==="overview" ? "hogwarts" : view;

    $("event-status").value="Не решено";

    const selectedDate=
        date || toISO(new Date(
            current.getFullYear(),
            current.getMonth(),
            1
        ));

    $("event-start").value=selectedDate;
    $("event-end").value=selectedDate;

    $("event-note").value="";

    $("sole-decision").value="Не решено";
    $("extra-decision").value="Не решено";

    $("delete-event").classList.remove("visible");

    updateHogwartsFields();

    $("event-modal").classList.add("open");
}


/* =========================
   ОТКРЫТЬ СОБЫТИЕ
========================= */

function openEvent(id){
    const event=allEvents().find(e=>e.id===id);

    if(!event)return;

    editingId=id;

    $("modal-title").textContent=event.name;

    $("event-name").value=event.name;
    $("event-category").value=event.category;
    $("event-status").value=event.status||"Не решено";

    $("event-start").value=event.start;
    $("event-end").value=event.end;

    $("event-note").value=event.note||"";

    $("sole-decision").value=
        event.soleDecision||"Не решено";

    $("extra-decision").value=
        event.extraDecision||"Не решено";

    /*
    События из calendar.js можно смотреть
    и менять решения по магазинам,
    но удаляем мы только свои события.
    */

    $("delete-event")
        .classList.toggle(
            "visible",
            !event.locked
        );

    updateHogwartsFields();

    $("event-modal").classList.add("open");
}


/* =========================
   HOGWARTS FIELDS
========================= */

$("event-category").addEventListener(
    "change",
    updateHogwartsFields
);

function updateHogwartsFields(){
    const isHogwarts=
        $("event-category").value==="hogwarts";

    $("hogwarts-details")
        .classList.toggle(
            "open",
            isHogwarts
        );
}


/* =========================
   СОХРАНЕНИЕ
========================= */

function saveEvent(){
    const name=$("event-name").value.trim();
    const category=$("event-category").value;
    const start=$("event-start").value;
    const end=$("event-end").value;

    if(!name){
        alert("Укажи название события.");
        return;
    }

    if(!start||!end){
        alert("Укажи даты.");
        return;
    }

    if(end<start){
        alert("Дата окончания не может быть раньше начала.");
        return;
    }

    const data={
        name,
        category,
        start,
        end,

        status:$("event-status").value,
        note:$("event-note").value.trim(),

        soleDecision:
            category==="hogwarts"
                ?$("sole-decision").value
                :"",

        extraDecision:
            category==="hogwarts"
                ?$("extra-decision").value
                :""
    };


    /*
    Если редактируем базовое событие Хогвартса,
    не меняем calendar.js.
    Создаём локальную копию с тем же ID.
    */

    if(editingId){

        const localIndex=
            customEvents.findIndex(
                e=>e.id===editingId
            );

        if(localIndex!==-1){

            customEvents[localIndex]={
                ...customEvents[localIndex],
                ...data
            };

        }else{

            const original=
                baseEvents.find(
                    e=>e.id===editingId
                );

            if(original){

                customEvents.push({
                    ...original,
                    ...data,
                    locked:false,
                    override:true
                });

            }

        }

    }else{

        customEvents.push({
            id:
                "event-"+Date.now(),

            ...data,

            locked:false
        });

    }

    saveLocal();
    closeModal();
    render();
}


/* =========================
   УДАЛЕНИЕ
========================= */

function deleteEvent(){
    if(!editingId)return;

    if(!confirm("Удалить это событие?")){
        return;
    }

    customEvents=
        customEvents.filter(
            e=>e.id!==editingId
        );

    saveLocal();
    closeModal();
    render();
}


/* =========================
   MODAL
========================= */

function closeModal(){
    $("event-modal")
        .classList.remove("open");

    editingId=null;
}

$("event-modal").addEventListener(
    "click",
    event=>{
        if(event.target===$("event-modal")){
            closeModal();
        }
    }
);


/* =========================
   HELPERS
========================= */

function toISO(date){
    const year=date.getFullYear();

    const month=
        String(date.getMonth()+1)
            .padStart(2,"0");

    const day=
        String(date.getDate())
            .padStart(2,"0");

    return `${year}-${month}-${day}`;
}


function formatDate(value){
    if(!value)return"";

    return new Date(
        value+"T00:00:00"
    ).toLocaleDateString(
        "ru-RU",
        {
            day:"numeric",
            month:"short"
        }
    );
}


function categoryName(category){
    return {
        sole:"SÓLE",
        extra:"EXTRA",
        hogwarts:"Хогвартс"
    }[category]||category;
}


/* =========================
   ВАЖНО:
   УБИРАЕМ ДУБЛЬ БАЗОВОГО
   СОБЫТИЯ ПРИ ЛОКАЛЬНОЙ ПРАВКЕ
========================= */

    const base=
        baseEvents.filter(
            e=>!overrides.has(e.id)
        );

    return [
        ...base,
        ...customEvents
    ];
}


/* =========================
   START
========================= */

render();

</script>
</body>
</html>
