<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosting — Ananel Coval</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#005500;
    --pink:#D4007E;
    --text:#181818;
    --muted:#8b878a;
    --line:#e8e4e7;
    --soft:#f8f6f7;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    background:#fff;
    color:var(--text);
    font-family:'Montserrat',sans-serif;
}
.page{
    max-width:1500px;
    margin:auto;
    padding:24px;
}

/* HEADER */

.header{
    position:relative;
    z-index:100;
    padding:22px 28px;
    border:1px solid var(--line);
    border-radius:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.brand{
    display:flex;
    align-items:baseline;
    gap:14px;
}
.logo{
    margin:0;
    color:var(--green);
    font-size:30px;
}
.header-label{
    color:#aaa;
    font-size:10px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
}
.header-right,.navigation{
    display:flex;
    align-items:center;
}
.header-right{gap:35px}
.navigation{gap:28px}

.home-link{
    color:#999;
    font-size:12px;
    font-weight:600;
    text-decoration:none;
}
.home-link:hover{color:var(--pink)}

/* DROPDOWN */

.nav-dropdown{position:relative}

.nav-title{
    display:flex;
    gap:6px;
    align-items:center;
    color:var(--green);
    font-size:13px;
    font-weight:700;
    cursor:default;
}
.nav-title::after{
    content:"⌄";
    color:var(--pink);
    transform:translateY(-2px);
}

.dropdown-menu{
    position:absolute;
    top:calc(100% + 12px);
    right:0;
    min-width:230px;
    max-height:400px;
    overflow:auto;
    padding:8px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 14px 40px rgba(0,0,0,.09);
    opacity:0;
    visibility:hidden;
    transform:translateY(-5px);
    transition:.18s;
}
.dropdown-menu::before{
    content:"";
    position:absolute;
    top:-14px;
    left:0;
    right:0;
    height:14px;
}
.nav-dropdown:hover .dropdown-menu{
    opacity:1;
    visibility:visible;
    transform:none;
}
.dropdown-menu a,.dropdown-empty{
    display:block;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    white-space:nowrap;
}
.dropdown-menu a{
    color:#333;
    font-weight:500;
    text-decoration:none;
}
.dropdown-menu a:hover{
    background:var(--soft);
    color:var(--pink);
}
.dropdown-empty{color:#aaa}

/* STORES */

#stores{margin-top:65px}

.store{margin-bottom:110px}

.store-heading{
    margin-bottom:55px;
    display:flex;
    align-items:center;
    gap:18px;
}
.store-heading h2{
    margin:0;
    color:var(--green);
    font-size:21px;
}
.store-line{
    flex:1;
    height:1px;
    background:var(--line);
}
.store-count{
    color:#aaa;
    font-size:11px;
}

/* COLLECTION */

.collection{
    margin-bottom:100px;
    scroll-margin-top:30px;
}
.collection-heading{
    margin-bottom:38px;
    text-align:center;
}
.collection-number{
    display:block;
    margin-bottom:9px;
    color:var(--pink);
    font-size:10px;
    font-weight:700;
    letter-spacing:2px;
}
.collection-title{
    margin:0;
    font-size:29px;
    font-weight:600;
}
.section-title{
    margin:42px 0 25px;
    text-align:center;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

/* GALLERIES */

.models-gallery,.decor-gallery{
    display:grid;
    justify-content:center;
}
.models-gallery{
    grid-template-columns:repeat(5,minmax(170px,230px));
    gap:25px 15px;
}
.decor-gallery{
    grid-template-columns:repeat(4,minmax(210px,280px));
    gap:25px;
}

.model-card,.decor-card{
    min-width:0;
    text-align:center;
}
.model-image-box,.decor-image-box{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    border-radius:16px;
    transition:.2s;
}
.model-image-box{
    height:230px;
    padding:12px;
}
.decor-image-box{
    height:245px;
    padding:15px;
}
.model-card:hover .model-image-box,
.decor-card:hover .decor-image-box{
    background:var(--soft);
    transform:translateY(-3px);
}
.model-image,.decor-image{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    cursor:pointer;
}
.item-name{
    margin:14px 0 0;
    font-size:13px;
    font-weight:600;
}

.collection-divider{
    width:70px;
    height:1px;
    margin:90px auto 0;
    background:#ddd7db;
}

.empty-store{
    padding:50px;
    border:1px dashed var(--line);
    border-radius:18px;
    color:#aaa;
    text-align:center;
    font-size:13px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    padding:12px 18px;
    background:#171717;
    color:#fff;
    border-radius:30px;
    font-size:12px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,15px);
    transition:.25s;
    z-index:500;
}
.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(max-width:1200px){
    .models-gallery{grid-template-columns:repeat(4,220px)}
    .decor-gallery{grid-template-columns:repeat(3,270px)}
}
@media(max-width:950px){
    .models-gallery{grid-template-columns:repeat(3,220px)}
    .decor-gallery{grid-template-columns:repeat(2,270px)}
}
@media(max-width:700px){
    .page{padding:12px}
    .header{padding:18px}
    .header-label,.home-link{display:none}
    .logo{font-size:24px}
    .header-right{gap:18px}
    .navigation{gap:18px}
    #stores{margin-top:45px}
    .models-gallery{grid-template-columns:repeat(2,minmax(145px,1fr))}
    .model-image-box{height:190px}
    .decor-gallery{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="page">

<header class="header">
    <div class="brand">
        <h1 class="logo">Ananel Coval</h1>
        <span class="header-label">Image Hosting</span>
    </div>

    <div class="header-right">
        <nav id="navigation" class="navigation"></nav>
        <a class="home-link" href="../">← Workspace</a>
    </div>
</header>

<main id="stores"></main>

</div>

<div id="toast" class="toast">Ссылка скопирована</div>

<script src="../data/products.js"></script>

<script>
const STORE_ORDER=["sole","extra"];
const $=id=>document.getElementById(id);

function buildHosting(){
    STORE_ORDER.forEach(key=>{
        const store=STORES[key];
        if(!store)return;
        buildNav(key,store);
        buildStore(key,store);
    });
}

function buildNav(key,store){
    const el=document.createElement("div");
    el.className="nav-dropdown";

    const links=store.collections.map(c=>
        `<a href="#${key}-${c.id}">${c.name}</a>`
    ).join("");

    el.innerHTML=`
        <span class="nav-title">${store.name}</span>
        <div class="dropdown-menu">
            ${links||'<span class="dropdown-empty">Пока пусто</span>'}
        </div>`;

    $("navigation").appendChild(el);
}

function buildStore(key,store){
    const el=document.createElement("section");
    el.className="store";

    el.innerHTML=`
        <div class="store-heading">
            <h2>${store.name}</h2>
            <div class="store-line"></div>
            <span class="store-count">
                ${store.collections.length} ${word(store.collections.length)}
            </span>
        </div>
        <div class="store-content"></div>`;

    const content=el.querySelector(".store-content");

    if(!store.collections.length){
        content.innerHTML='<div class="empty-store">Коллекции пока не добавлены.</div>';
    }else{
        store.collections.forEach((c,i)=>buildCollection(key,c,i,content));
    }

    $("stores").appendChild(el);
}

function buildCollection(storeKey,c,index,container){
    const el=document.createElement("section");
    const hasDecor=c.decor?.length;
    el.className="collection";
    el.id=`${storeKey}-${c.id}`;

    el.innerHTML=`
        <div class="collection-heading">
            <span class="collection-number">
                COLLECTION ${String(index+1).padStart(2,"0")}
            </span>
            <h3 class="collection-title">${c.name}</h3>
        </div>

        <h4 class="section-title">Модели</h4>
        <div class="models-gallery"></div>

        ${hasDecor?`
            <h4 class="section-title">Декор</h4>
            <div class="decor-gallery"></div>
        `:""}

        <div class="collection-divider"></div>`;

    container.appendChild(el);

    buildGallery(
        el.querySelector(".models-gallery"),
        path(storeKey,c,"models"),
        c.models||[],
        true
    );

    if(hasDecor)buildGallery(
        el.querySelector(".decor-gallery"),
        path(storeKey,c,"decor"),
        c.decor,
        false
    );
}

function buildGallery(container,path,items,isModel){
    items.forEach((item,index)=>{
        const card=document.createElement("div");
        card.className=isModel?"model-card":"decor-card";

        card.innerHTML=`
            <div class="${isModel?"model-image-box":"decor-image-box"}">
                <img
                    class="${isModel?"model-image":"decor-image"}"
                    src="${path}/${item.file}"
                    alt="${item.name}"
                    title="Нажмите, чтобы скопировать ссылку">
            </div>

            <p class="item-name">
                ${isModel?String(index+1).padStart(2,"0")+". ":""}${item.name}
            </p>`;

        card.querySelector("img").onclick=e=>copyLink(e.currentTarget);
        container.appendChild(card);
    });
}

function path(store,c,type){
    return `../${store}/products/${c.folder}/${type}`;
}

function copyLink(img){
    navigator.clipboard.writeText(img.src)
        .then(()=>{
            $("toast").classList.add("show");
            clearTimeout(window.toastTimer);
            window.toastTimer=setTimeout(()=>$("toast").classList.remove("show"),1500);
        })
        .catch(()=>alert("Не удалось скопировать ссылку."));
}

function word(n){
    if(n%100>=11&&n%100<=14)return"коллекций";
    if(n%10===1)return"коллекция";
    if(n%10>=2&&n%10<=4)return"коллекции";
    return"коллекций";
}

buildHosting();
</script>

</body>
</html>
