<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ananel Coval</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================
           ОСНОВА СТРАНИЦЫ
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 8px;
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            color: #111111;
        }


        /* =========================
           ШАПКА
        ========================= */

        .header {
            border: 4px solid #D4007E;
            border-radius: 15px;

            padding: 25px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            margin: 0;

            color: #005500;

            font-size: 56px;
            font-weight: 700;
        }

        .navigation {
            display: flex;
            gap: 40px;
        }

        .navigation a {
            color: #005500;

            text-decoration: none;
            font-weight: 600;
        }
/* =========================
   ВЫПАДАЮЩЕЕ МЕНЮ
========================= */

.nav-dropdown {
    position: relative;
}

.nav-title {
    color: #005500;
    font-weight: 600;
    cursor: default;

    display: flex;
    align-items: center;
    gap: 6px;
}

.nav-title::after {
    content: "⌄";
    font-size: 14px;
}

.dropdown-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;

    min-width: 220px;
    padding: 8px;

    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);

    opacity: 0;
    visibility: hidden;
    transform: translateY(-5px);

    transition: 0.2s;

    z-index: 100;
}

/* невидимый мостик, чтобы меню не закрывалось
   пока мышь идёт от SÓLE к меню */
.dropdown-menu::before {
    content: "";
    position: absolute;
    height: 12px;
    left: 0;
    right: 0;
    top: -12px;
}

.nav-dropdown:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.dropdown-menu a {
    display: block;

    padding: 10px 14px;

    border-radius: 8px;

    color: #222222;

    font-size: 14px;
    font-weight: 500;

    white-space: nowrap;
}

.dropdown-menu a:hover {
    background-color: #f7f3f5;
    color: #D4007E;
}


        /* =========================
           ЗАГОЛОВОК КОЛЛЕКЦИИ
        ========================= */

        .collection-header {
            margin: 55px 0 35px;
            text-align: center;
        }

        .shop-title {
            margin: 0 0 8px;

            color: #005500;

            font-size: 36px;
            font-weight: 700;
        }

        .pink-line {
            width: 50px;
            height: 3px;

            margin: 0 auto 22px;

            background-color: #D4007E;
            border-radius: 10px;
        }

        .collection-title {
            margin: 0;

            font-size: 22px;
            font-weight: 500;
        }


        /* =========================
           МОДЕЛИ
        ========================= */

        .models-gallery {
            display: grid;

            grid-template-columns: repeat(5, 230px);

            justify-content: center;

            column-gap: 15px;
            row-gap: 30px;
        }

        .model-card {
            width: 230px;
            text-align: center;
        }

        .model-image-box {
            height: 230px;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            padding: 10px;
        }

        .model-image {
            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            cursor: pointer;
        }

        .item-name {
            margin: 15px 0 0;

            font-size: 16px;
            font-weight: 600;
        }


        /* =========================
           ДЕКОР
        ========================= */

        .decor-title {
            margin: 60px 0 25px;

            text-align: center;

            font-size: 22px;
            font-weight: 500;
        }

        .decor-gallery {
            display: grid;

            grid-template-columns: repeat(3, 300px);

            justify-content: center;

            gap: 30px;

            margin-bottom: 60px;
        }

        .decor-card {
            width: 300px;
            text-align: center;
        }

        .decor-image-box {
            height: 260px;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            padding: 15px;
        }

        .decor-image {
            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            cursor: pointer;
        }


        /* =========================
           АДАПТАЦИЯ
        ========================= */

        @media (max-width: 1250px) {

            .models-gallery {
                grid-template-columns: repeat(4, 230px);
            }

        }

        @media (max-width: 1000px) {

            .models-gallery {
                grid-template-columns: repeat(3, 230px);
            }

            .decor-gallery {
                grid-template-columns: repeat(2, 300px);
            }

        }

        @media (max-width: 760px) {

            .header {
                padding: 20px;

                flex-direction: column;
                gap: 20px;
            }

            .logo {
                font-size: 40px;
            }

            .models-gallery {
                grid-template-columns: repeat(2, 200px);
            }

            .model-card {
                width: 200px;
            }

            .decor-gallery {
                grid-template-columns: 300px;
            }

        }

    </style>
</head>


<body>

    <!-- ШАПКА -->

    <header class="header">

        <h1 class="logo">
            Ananel Coval
        </h1>

        <nav class="navigation">

            <a href="#sole">
                SÓLE
            </a>

            <a href="#extra">
                EXTRA
            </a>

        </nav>

    </header>


    <!-- SÓLE -->

    <section>

        <div class="collection-header">

            <h2 id="sole" class="shop-title">
                SÓLE
            </h2>

            <div class="pink-line"></div>

            <h3 class="collection-title">
                Архитектура
            </h3>

        </div>


        <!-- МОДЕЛИ -->

        <div
            id="architecture-gallery"
            class="models-gallery">
        </div>


        <!-- ДЕКОР -->

        <h3 class="decor-title">
            Декор
        </h3>

        <div
            id="architecture-decor"
            class="decor-gallery">
        </div>

    </section>


    <script>

        /* =========================
           ДАННЫЕ
        ========================= */

        const architecture = [

            {
                file: "01-stairs.png",
                name: "01. Лестницы"
            },

            {
                file: "02-north-wing.png",
                name: "02. Северное крыло"
            },

            {
                file: "03-astronomy-tower.png",
                name: "03. Астрономическая башня"
            },

            {
                file: "04-map.png",
                name: "04. Карта Мародёров"
            },

            {
                file: "05-greenhouse.png",
                name: "05. Оранжерея"
            },

            {
                file: "06-keyhole.png",
                name: "06. Ключница"
            },

            {
                file: "07-letter.png",
                name: "07. Письмо"
            },

            {
                file: "08-hogsmeade.png",
                name: "08. Хогсмид"
            },

            {
                file: "09-candelabra.png",
                name: "09. Канделябр"
            },

            {
                file: "10-hat.png",
                name: "10. Шляпа"
            }

        ];


        const architectureDecor = [

            {
                file: "base-bag.png",
                name: "Пакет"
            },

            {
                file: "base-card.png",
                name: "Карточка"
            },

            {
                file: "base-preview.jpeg",
                name: "Превью"
            }

        ];


        /* =========================
           ГАЛЕРЕЯ МОДЕЛЕЙ
        ========================= */

        const gallery =
            document.getElementById("architecture-gallery");


        architecture.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "model-card";


            card.innerHTML = `

                <div class="model-image-box">

                    <img
                        class="model-image"

                        src="sole/products/2026-06-architecture/models/${item.file}"

                        alt="${item.name}"

                        title="Нажмите, чтобы скопировать ссылку"

                        onclick="copyImageLink(this)"
                    >

                </div>


                <p class="item-name">
                    ${item.name}
                </p>

            `;


            gallery.appendChild(card);

        });


        /* =========================
           ГАЛЕРЕЯ ДЕКОРА
        ========================= */

        const decorGallery =
            document.getElementById("architecture-decor");


        architectureDecor.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "decor-card";


            card.innerHTML = `

                <div class="decor-image-box">

                    <img
                        class="decor-image"

                        src="sole/products/2026-06-architecture/decor/${item.file}"

                        alt="${item.name}"

                        title="Нажмите, чтобы скопировать ссылку"

                        onclick="copyImageLink(this)"
                    >

                </div>


                <p class="item-name">
                    ${item.name}
                </p>

            `;


            decorGallery.appendChild(card);

        });


        /* =========================
           КОПИРОВАНИЕ ССЫЛКИ
        ========================= */

        function copyImageLink(image) {

            const link = image.src;

            navigator.clipboard
                .writeText(link)
                .then(() => {

                    alert(
                        "Ссылка на изображение скопирована!"
                    );

                });

        }

    </script>

</body>

</html>
