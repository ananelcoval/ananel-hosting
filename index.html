<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Ananel Coval</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ШАПКА -->
    <div style="
        border: 4px solid #D4007E;
        border-radius: 15px;
        padding: 25px 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    ">

        <h1 style="
            color: #005500;
            font-family: 'Montserrat', sans-serif;
            font-size: 56px;
            margin: 0;
        ">
            Ananel Coval
        </h1>

        <!-- НАВИГАЦИЯ -->
        <div style="
            display: flex;
            gap: 40px;
            font-family: 'Montserrat', sans-serif;
        ">

            <a href="#sole" style="
                color: #005500;
                text-decoration: none;
                font-weight: 600;
            ">
                SÓLE
            </a>

            <a href="#extra" style="
                color: #005500;
                text-decoration: none;
                font-weight: 600;
            ">
                EXTRA
            </a>

        </div>

    </div>


    <!-- SÓLE -->
    <div style="
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    margin: 55px 0 35px;
">

    <h2 id="sole" style="
        color: #005500;
        font-size: 36px;
        margin: 0 0 8px;
    ">
        SÓLE
    </h2>

    <div style="
        width: 50px;
        height: 3px;
        background-color: #D4007E;
        margin: 0 auto 22px;
        border-radius: 10px;
    "></div>

    <h3 style="
        font-size: 22px;
        font-weight: 500;
        margin: 0;
    ">
        Архитектура
    </h3>

</div>


    <!-- ГАЛЕРЕЯ -->
    <div
        id="architecture-gallery"
        style="
            display: grid;
            grid-template-columns: repeat(5, 230px);
            gap: 15px;
            justify-content: center;
        ">
    </div>

    <!-- ДЕКОР -->
    <h3 style="
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 500;
            margin: 50px 0 25px;
        ">
    Декор
</h3>

<div
    id="architecture-decor"
    style="
        display: grid;
        grid-template-columns: repeat(3, 230px);
        gap: 30px;
        justify-content: center;
    ">
</div>
    <script>

        // ДАННЫЕ КОЛЛЕКЦИИ

        const architecture = [
            {
                file: "01-stairs.png",
                name: "01. Лестницы"
            },
            {
                file: "02-north-wing.png",
                name: "02. Северное крыло"
            },
            {
                file: "03-astronomy-tower.png",
                name: "03. Астрономическая башня"
            },
            {
                file: "04-map.png",
                name: "04. Карта Мародёров"
            },
            {
                file: "05-greenhouse.png",
                name: "05. Оранжерея"
            },
            {
                file: "06-keyhole.png",
                name: "06. Ключница"
            },
            {
                file: "07-letter.png",
                name: "07. Письмо"
            },
            {
                file: "08-hogsmeade.png",
                name: "08. Хогсмид"
            },
            {
                file: "09-candelabra.png",
                name: "09. Канделябр"
            },
            {
                file: "10-hat.png",
                name: "10. Шляпа"
            }
        ];

const architectureDecor = [
    {
        file: "base-bag.png",
        name: "Пакет"
    },
    {
        file: "base-card.png",
        name: "Карточка"
    },
    {
        file: "base-preview.jpeg",
        name: "Превью"
    }
];
        // НАХОДИМ ГАЛЕРЕЮ

        const gallery = document.getElementById("architecture-gallery");


        // СОЗДАЁМ КАРТОЧКУ ДЛЯ КАЖДОЙ МОДЕЛИ

        architecture.forEach(item => {

            const card = document.createElement("div");

            card.style.width = "260px";
            card.style.textAlign = "center";

            card.innerHTML = `
                <div style="
                    background-color: white;
                    padding: 15px;
                ">

                    <img
                        src="sole/products/2026-06-architecture/models/${item.file}"
                        alt="${item.name}"
                        style="
                            width: 100%;
                            cursor: pointer;
                        "
                        title="Нажмите, чтобы скопировать ссылку"
                        onclick="copyImageLink(this)"
                    >

                </div>

                <p style="
                    font-family: 'Montserrat', sans-serif;
                    font-weight: 600;
                ">
                    ${item.name}
                </p>
            `;

            gallery.appendChild(card);
        });

const decorGallery = document.getElementById("architecture-decor");

architectureDecor.forEach(item => {

    const card = document.createElement("div");

    card.style.width = "300px";
    card.style.textAlign = "center";

    card.innerHTML = `
        <div style="
            background-color: white;
            padding: 15px;
        ">

            <img
                src="sole/products/2026-06-architecture/decor/${item.file}"
                alt="${item.name}"
                style="
                    width: 100%;
                    cursor: pointer;
                "
                title="Нажмите, чтобы скопировать ссылку"
                onclick="copyImageLink(this)"
            >

        </div>

        <p style="
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        ">
            ${item.name}
        </p>
    `;

    decorGallery.appendChild(card);
});
        // КОПИРОВАНИЕ ССЫЛКИ

        function copyImageLink(image) {

            const link = image.src;

            navigator.clipboard.writeText(link).then(() => {
                alert("Ссылка на изображение скопирована!");
            });

        }

    </script>

</body>

</html>
