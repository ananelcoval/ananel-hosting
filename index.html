
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ananel Coval — Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#005500;
    --pink:#D4007E;
    --text:#171717;
    --muted:#999;
    --line:#dedade;
    --paper:#f7f5f6;
}
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--text);
    font-family:Montserrat,sans-serif;
}
a{text-decoration:none;color:inherit}
.page{
    min-height:100vh;
    padding:24px;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */
.header{
    padding:24px 30px;
    border:3px solid var(--pink);
    border-radius:18px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}
.logo{
    margin:0;
    color:var(--green);
    font-size:32px;
    font-weight:700;
}
.header-label{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =========================
   MAIN
========================= */
.hero{
    flex:1;
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:65px 0;
    display:flex;
    flex-direction:column;
    justify-content:center;
}
.eyebrow{
    margin-bottom:12px;
    color:var(--pink);
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
}
.hero h2{
    margin:0 0 40px;
    color:var(--green);
    font-size:48px;
    font-weight:700;
    letter-spacing:-2px;
}

/* =========================
   MODULES
========================= */
.modules{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
}
.module{
    min-height:270px;
    padding:26px;
    border:1px solid var(--line);
    border-radius:20px;
    background:#fff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:transform .2s,border-color .2s,box-shadow .2s;
}
.module:hover{
    transform:translateY(-3px);
    border-color:var(--pink);
    box-shadow:0 12px 30px #00000009;
}
.module-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.module-number{
    color:#bbb;
    font-size:12px;
    font-weight:600;
}
.module-icon{
    width:40px;
    height:40px;
    border:1px solid #eae5e8;
    border-radius:12px;
    display:grid;
    place-items:center;
    color:var(--green);
}
.module-icon svg{
    width:20px;
    height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.module h3{
    margin:0;
    color:var(--green);
    font-size:28px;
    font-weight:700;
    letter-spacing:-.8px;
}
.module-sub{
    margin:9px 0 0;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
}
.module-arrow{
    margin-top:18px;
    color:var(--pink);
    font-size:21px;
    font-weight:600;
}

/* =========================
   HOSTING LINKS
========================= */
.hosting-links{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:17px;
}
.hosting-link{
    padding:10px 12px;
    border:1px solid #eee9ec;
    border-radius:9px;
    background:#faf9fa;
    color:#555;
    font-size:11px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:.2s;
}
.hosting-link:hover{
    border-color:var(--pink);
    background:#fff;
    color:var(--green);
}
.hosting-link span:last-child{
    color:var(--pink);
}
.hosting-link.disabled{
    color:#bbb;
    cursor:default;
}
.hosting-link.disabled:hover{
    border-color:#eee9ec;
    background:#faf9fa;
    color:#bbb;
}
.hosting-link.disabled span:last-child{
    color:#bbb;
}

/* =========================
   FOOTER
========================= */
.footer{
    padding:0 5px;
    display:flex;
    justify-content:space-between;
    color:#aaa;
    font-size:11px;
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:1000px){
    .modules{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:750px){
    .page{padding:12px}
    .header{padding:20px}
    .logo{font-size:25px}
    .header-label{display:none}
    .hero{padding:55px 5px}
    .hero h2{font-size:38px}
    .modules{grid-template-columns:1fr}
    .module{min-height:230px}
    .footer{margin-top:25px}
}
</style>
</head>

<body>
<div class="page">

    <!-- HEADER -->
    <header class="header">
        <h1 class="logo">Ananel Coval</h1>
        <div class="header-label">Personal Workspace</div>
    </header>

    <main class="hero">
        <div class="eyebrow">Workspace</div>
        <h2>Рабочее пространство.</h2>

        <div class="modules">

            <!-- HOSTING -->
            <section class="module">
                <div class="module-top">
                    <span class="module-number">01 / HOSTING</span>
                    <div class="module-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="3"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="m3 17 5-5 4 4 3-3 6 6"/>
                        </svg>
                    </div>
                </div>

                <div>
                    <h3>Hosting</h3>
                    <p class="module-sub">Изображения и файлы</p>

                    <nav class="hosting-links" aria-label="Разделы Hosting">
                        <a class="hosting-link" href="hosting/">
                            <span>Магазины</span>
                            <span>↗</span>
                        </a>
                        <span class="hosting-link disabled">
                            <span>Общее</span>
                            <span>Скоро</span>
                        </span>
                        <span class="hosting-link disabled">
                            <span>Ивенты</span>
                            <span>Скоро</span>
                        </span>
                    </nav>
                </div>
            </section>

            <!-- MANAGER -->
            <a class="module" href="manager/">
                <div class="module-top">
                    <span class="module-number">02 / MANAGER</span>
                    <div class="module-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="3"/>
                            <path d="M3 9h18M9 9v12"/>
                            <path d="M13 14h4M13 18h4"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h3>Manager</h3>
                    <p class="module-sub">Управление магазинами</p>
                    <div class="module-arrow">↗</div>
                </div>
            </a>

            <!-- CALENDAR -->
            <a class="module" href="calendar/">
                <div class="module-top">
                    <span class="module-number">03 / CALENDAR</span>
                    <div class="module-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="16" rx="3"/>
                            <path d="M7 3v4M17 3v4M3 10h18"/>
                            <path d="M8 14h3M14 14h2M8 18h3"/>
                        </svg>
                    </div>
                </div>
                <div>
                    <h3>Calendar</h3>
                    <p class="module-sub">События и планы</p>
                    <div class="module-arrow">↗</div>
                </div>
            </a>

        </div>
    </main>

    <footer class="footer">
        <span>ANANEL COVAL</span>
        <span>2026</span>
    </footer>

</div>
</body>
</html>
