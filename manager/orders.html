<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders — Ananel Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#005500;
    --pink:#D4007E;
    --bg:#f7f5f6;
    --text:#171717;
    --muted:#888;
    --line:#e2dee1;
    --soft:#faf8f9;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
}

.page{
    max-width:1400px;
    margin:auto;
    padding:24px;
}

button{font-family:inherit}


/* HEADER */

.header{
    padding:22px 30px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    margin:0;
    color:var(--green);
    font-size:30px;
}

.back{
    color:#999;
    font-size:12px;
    font-weight:600;
    text-decoration:none;
}

.back:hover{color:var(--pink)}


/* TITLE */

.top{
    margin:55px 0 30px;
    display:flex;
    justify-content:space-between;
    align-items:end;
}

.top h2{
    margin:0;
    color:var(--green);
    font-size:38px;
}

.top p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:13px;
}

.add-button{
    padding:13px 19px;
    border:0;
    border-radius:11px;
    background:var(--green);
    color:#fff;
    font-weight:600;
    cursor:pointer;
}

.add-button:hover{background:var(--pink)}


/* FORM */

.form-panel{
    display:none;
    margin-bottom:30px;
    padding:28px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
}

.form-panel.open{display:block}

.form-panel h3{
    margin:0 0 24px;
    font-size:21px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{grid-column:1/-1}

label{
    color:#777;
    font-size:11px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
}

input,
select,
textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #d8d4d7;
    border-radius:9px;
    background:#fff;
    font:inherit;
    font-size:14px;
}

textarea{
    min-height:80px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:var(--pink);
}

.product-fields{
    grid-column:1/-1;
    padding:20px;
    background:#faf9fa;
    border-radius:13px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.form-actions{
    margin-top:22px;
    display:flex;
    gap:10px;
}

.save-button,
.cancel-button{
    padding:11px 17px;
    border-radius:9px;
    font-weight:600;
    cursor:pointer;
}

.save-button{
    border:0;
    background:var(--pink);
    color:#fff;
}

.cancel-button{
    border:1px solid var(--line);
    background:#fff;
    color:#666;
}


/* STATS */

.stats{
    margin-bottom:32px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.stat{
    padding:18px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
}

.stat-number{
    color:var(--green);
    font-size:27px;
    font-weight:700;
}

.stat-label{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
}


/* ORDERS */

.orders{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.order-card{
    position:relative;
    padding:21px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
}


/* ACTIVE */

.order-card.active{
    border-color:rgba(212,0,126,.28);
    box-shadow:0 5px 22px rgba(212,0,126,.05);
}

.order-card.active::before{
    content:"";
    position:absolute;
    top:-1px;
    left:22px;
    width:38px;
    height:3px;
    background:var(--pink);
    border-radius:0 0 5px 5px;
}


/* CARD */

.order-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.shop{
    color:var(--pink);
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
}

.price{
    color:var(--green);
    font-weight:700;
}

.collection-name{
    margin-top:16px;
    color:#999;
    font-size:10px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
}

.order-card h3{
    margin:5px 0;
    font-size:18px;
}

.recipient{
    color:#777;
    font-size:13px;
}

.note{
    margin-top:14px;
    padding:11px 12px;
    background:var(--soft);
    border-radius:9px;
    color:#666;
    font-size:12px;
    line-height:1.5;
}

.private-note{
    color:#777;
}

.meta{
    margin-top:17px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:#999;
    font-size:11px;
}


/* ACTIONS */

.order-actions{
    margin-top:17px;
    padding-top:14px;
    border-top:1px solid #eee;
    display:flex;
    align-items:center;
    gap:8px;
}

.order-actions select{
    width:auto;
    margin-left:auto;
    padding:7px 8px;
    font-size:11px;
}

.build-order{
    padding:8px 11px;
    border:1px solid var(--pink);
    border-radius:8px;
    background:#fff;
    color:var(--pink);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    transition:.18s;
}

.build-order:hover{
    background:var(--pink);
    color:#fff;
}

.delete{
    border:0;
    background:none;
    color:#aaa;
    font-size:11px;
    cursor:pointer;
}

.delete:hover{color:var(--pink)}


/* ARCHIVE */

.archive{
    margin-top:75px;
}

.archive-heading{
    margin-bottom:28px;
    display:flex;
    align-items:center;
    gap:16px;
}

.archive-heading h3{
    margin:0;
    color:#999;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

.archive-line{
    height:1px;
    flex:1;
    background:var(--line);
}

.archive-count{
    color:#aaa;
    font-size:11px;
}

.archive .order-card{
    opacity:.68;
    transition:.2s;
}

.archive .order-card:hover{
    opacity:1;
}

.empty{
    grid-column:1/-1;
    padding:60px 20px;
    color:#aaa;
    text-align:center;
}


/* MOBILE */

@media(max-width:900px){
    .orders{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){
    .page{
        padding:12px;
    }

    .top{
        align-items:start;
        gap:20px;
    }

    .form-grid,
    .product-fields,
    .orders{
        grid-template-columns:1fr;
    }

    .order-actions{
        flex-wrap:wrap;
    }
}
</style>
</head>

<body>

<div class="page">

<header class="header">
    <h1 class="logo">Ananel Manager</h1>
    <a class="back" href="../">← Workspace</a>
</header>


<div class="top">
    <div>
        <h2>Заказы</h2>
        <p>SÓLE · EXTRA</p>
    </div>

    <button class="add-button" onclick="toggleForm()">
        + Новый заказ
    </button>
</div>


<!-- NEW ORDER FORM -->

<div id="form-panel" class="form-panel">

<h3>Новый заказ</h3>

<div class="form-grid">

    <div class="field">
        <label>Магазин</label>
        <select id="shop" onchange="loadCollections()"></select>
    </div>

    <div class="field">
        <label>Сумма</label>
        <input id="price" type="number" min="0" placeholder="30">
    </div>

    <div class="field">
        <label>Заказчик</label>
        <input id="customer" placeholder="Chris Everington">
    </div>

    <div class="field">
        <label>Получатель</label>
        <input id="recipient" placeholder="Ариадна Фрост">
    </div>


    <div class="product-fields">

        <div class="field">
            <label>Коллекция</label>
            <select id="collection" onchange="loadModels()"></select>
        </div>

        <div class="field">
            <label>Модель</label>
            <select id="model"></select>
        </div>

    </div>


    <div class="field">
        <label>Куда доставить</label>

        <select id="delivery">
            <option>Хогсмид</option>
            <option>ГФ</option>
        </select>
    </div>

    <div class="field">
        <label>Дата заказа</label>
        <input id="date" type="date">
    </div>


    <div class="field full">
        <label>Записка получателю</label>

        <textarea
            id="gift-note"
            placeholder="Если записка не нужна — оставить пустым"></textarea>
    </div>


    <div class="field full">
        <label>Мои пометки</label>

        <textarea
            id="private-notes"
            placeholder="Внутренние заметки по заказу"></textarea>
    </div>

</div>


<div class="form-actions">

    <button class="save-button" onclick="saveOrder()">
        Сохранить заказ
    </button>

    <button class="cancel-button" onclick="toggleForm(false)">
        Отмена
    </button>

</div>

</div>


<!-- STATS -->

<div class="stats">

    <div class="stat">
        <div id="new-count" class="stat-number">0</div>
        <div class="stat-label">Новые</div>
    </div>

    <div class="stat">
        <div id="delivered-count" class="stat-number">0</div>
        <div class="stat-label">Доставлено</div>
    </div>

    <div class="stat">
        <div id="cancelled-count" class="stat-number">0</div>
        <div class="stat-label">Отменено</div>
    </div>

    <div class="stat">
        <div id="total-money" class="stat-number">0</div>
        <div class="stat-label">Галлеонов получено</div>
    </div>

</div>


<!-- ACTIVE ORDERS -->

<div id="orders" class="orders"></div>


<!-- ARCHIVE -->

<section id="archive-section" class="archive">

    <div class="archive-heading">

        <h3>Архив</h3>

        <div class="archive-line"></div>

        <span
            id="archive-count"
            class="archive-count">
        </span>

    </div>

    <div
        id="archive-orders"
        class="orders">
    </div>

</section>

</div>


<!-- PRODUCTS DATABASE -->

<script src="../data/products.js"></script>


<script>

const $ = id => document.getElementById(id);

const statuses = [
    "Новый",
    "Доставлен",
    "Отменён"
];

let orders =
    JSON.parse(
        localStorage.getItem("ananelOrders")
    ) || [];


/* =========================
   MIGRATION
========================= */

/*
Старые промежуточные статусы,
если такие сохранились,
возвращаем в "Новый".
*/

orders.forEach(order => {

    if (!statuses.includes(order.status)) {
        order.status = "Новый";
    }

});

saveOrders();


/* =========================
   CATALOG
========================= */

function initCatalog() {

    $("shop").innerHTML =
        Object.entries(STORES)
            .map(([key, store]) => `
                <option value="${key}">
                    ${store.name}
                </option>
            `)
            .join("");

    loadCollections();

}


function loadCollections() {

    const store =
        STORES[$("shop").value];

    const collections =
        store?.collections || [];


    $("collection").innerHTML =
        collections.length

            ? collections
                .map(collection => `
                    <option value="${collection.id}">
                        ${collection.name}
                    </option>
                `)
                .join("")

            : `
                <option value="">
                    Нет коллекций
                </option>
            `;


    loadModels();

}


function loadModels() {

    const store =
        STORES[$("shop").value];


    const collection =
        store?.collections.find(
            item =>
                item.id ===
                $("collection").value
        );


    const models =
        collection?.models || [];


    $("model").innerHTML =
        models.length

            ? models
                .map((model, index) => `
                    <option value="${index}">
                        ${model.name}
                    </option>
                `)
                .join("")

            : `
                <option value="">
                    Нет моделей
                </option>
            `;

}


/* =========================
   FORM
========================= */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


$("date").value = today();

initCatalog();


function toggleForm(force) {

    const form =
        $("form-panel");


    if (force === false) {

        form.classList.remove("open");

        return;

    }


    form.classList.toggle("open");

}


function clearForm() {

    [
        "price",
        "customer",
        "recipient",
        "gift-note",
        "private-notes"

    ].forEach(id => {

        $(id).value = "";

    });


    $("date").value = today();

    $("shop").selectedIndex = 0;

    loadCollections();

}


/* =========================
   SAVE ORDER
========================= */

function saveOrder() {

    const storeKey =
        $("shop").value;


    const store =
        STORES[storeKey];


    const collection =
        store?.collections.find(
            item =>
                item.id ===
                $("collection").value
        );


    const modelIndex =
        Number(
            $("model").value
        );


    const model =
        collection?.models?.[modelIndex];


    if (!$("customer").value.trim()) {

        alert("Укажи заказчика.");

        return;

    }


    if (!collection || !model) {

        alert(
            "Выбери коллекцию и модель."
        );

        return;

    }


    const order = {

        id: Date.now(),

        storeKey: storeKey,
        shop: store.name,

        customer:
            $("customer").value.trim(),

        recipient:
            $("recipient").value.trim(),

        price:
            Number($("price").value) || 0,

        delivery:
            $("delivery").value,

        date:
            $("date").value,

        collectionId:
            collection.id,

        collection:
            collection.name,

        collectionFolder:
            collection.folder,

        modelFile:
            model.file,

        model:
            model.name,

        giftNote:
            $("gift-note").value.trim(),

        privateNotes:
            $("private-notes").value.trim(),

        status: "Новый",

        paid: true

    };


    orders.unshift(order);

    saveOrders();

    clearForm();

    toggleForm(false);

    renderOrders();

}


/* =========================
   STORAGE
========================= */

function saveOrders() {

    localStorage.setItem(
        "ananelOrders",
        JSON.stringify(orders)
    );

}


/* =========================
   STATUS
========================= */

function changeStatus(id, status) {

    const order =
        orders.find(
            item =>
                item.id === id
        );


    if (!order) return;


    order.status = status;

    saveOrders();

    renderOrders();

}


/* =========================
   DELETE
========================= */

function deleteOrder(id){
    if(!confirm("Удалить этот заказ?")) return;

    orders=orders.filter(order=>order.id!==id);
    saveOrders();
    renderOrders();
}


/* СОБРАТЬ ЗАКАЗ — ПОКА ЗАГЛУШКА */

function buildOrder(id){
    const order=orders.find(order=>order.id===id);
    if(!order) return;

    console.log("Собрать заказ:",order);
}


/* КАРТОЧКА ЗАКАЗА */

function orderCard(order,active){
    return `
        <article class="order-card ${active?"active":""}">

            <div class="order-head">
                <span class="shop">${order.shop}</span>
                <span class="price">${order.price||0} G</span>
            </div>

            <div class="collection-name">
                ${order.collection||""}
            </div>

            <h3>
                ${order.model||order.product||"Без названия"}
            </h3>

            <div class="recipient">
                ${order.recipient
                    ?"Для: "+order.recipient
                    :"Для себя"}
            </div>

            ${order.giftNote?`
                <div class="note">
                    «${order.giftNote}»
                </div>
            `:""}

            ${order.privateNotes?`
                <div class="note private-note">
                    <strong>Пометка:</strong>
                    ${order.privateNotes}
                </div>
            `:""}

            <div class="meta">
                <span>${order.customer}</span>
                <span>${order.delivery}</span>
                <span>${formatDate(order.date)}</span>
            </div>

            <div class="order-actions">

                ${active?`
                    <button
                        class="build-order"
                        onclick="buildOrder(${order.id})">
                        Собрать заказ
                    </button>
                `:""}

                <select onchange="changeStatus(${order.id},this.value)">
                    ${statuses.map(status=>`
                        <option
                            ${status===order.status?"selected":""}>
                            ${status}
                        </option>
                    `).join("")}
                </select>

                <button
                    class="delete"
                    onclick="deleteOrder(${order.id})">
                    Удалить
                </button>

            </div>

        </article>
    `;
}


/* СОРТИРОВКА И ВЫВОД */

function renderOrders(){

    const newest=(a,b)=>
        new Date(b.date||0)-new Date(a.date||0)
        || b.id-a.id;

    const active=orders
        .filter(order=>order.status==="Новый")
        .sort(newest);

    const archive=orders
        .filter(order=>
            order.status==="Доставлен" ||
            order.status==="Отменён"
        )
        .sort(newest);


    $("orders").innerHTML=active.length
        ?active.map(order=>orderCard(order,true)).join("")
        :'<div class="empty">Активных заказов нет.</div>';


    if(archive.length){

        $("archive-section").style.display="block";

        $("archive-count").textContent=
            archive.length;

        $("archive-orders").innerHTML=
            archive
                .map(order=>orderCard(order,false))
                .join("");

    }else{

        $("archive-section").style.display="none";

    }

    updateStats();
}


/* ДАТА */

function formatDate(date){
    if(!date) return "";

    return new Date(date+"T00:00:00")
        .toLocaleDateString("ru-RU");
}


/* СТАТИСТИКА */

function updateStats(){

    $("new-count").textContent=
        orders.filter(
            order=>order.status==="Новый"
        ).length;

    $("delivered-count").textContent=
        orders.filter(
            order=>order.status==="Доставлен"
        ).length;

    $("cancelled-count").textContent=
        orders.filter(
            order=>order.status==="Отменён"
        ).length;

    $("total-money").textContent=
        orders
            .filter(order=>order.status!=="Отменён")
            .reduce(
                (sum,order)=>
                    sum+(Number(order.price)||0),
                0
            );
}


/* ЗАПУСК */

renderOrders();

</script>
</body>
</html>
