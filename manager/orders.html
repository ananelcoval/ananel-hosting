<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders — Ananel Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --green:#005500;--pink:#D4007E;--bg:#f7f5f6;
    --text:#171717;--muted:#888;--line:#e2dee1;--soft:#faf8f9
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif}
.page{max-width:1400px;margin:auto;padding:24px}
button{font-family:inherit;cursor:pointer}

/* ОСНОВА */

.header,.form-panel,.stat,.order-card,.modal-box{background:#fff;border:1px solid var(--line)}

.header{
    padding:22px 30px;border-radius:18px;
    display:flex;justify-content:space-between;align-items:center
}
.logo{margin:0;color:var(--green);font-size:30px}
.back{color:#999;font-size:12px;font-weight:600;text-decoration:none}
.back:hover{color:var(--pink)}

.top{
    margin:55px 0 30px;display:flex;
    justify-content:space-between;align-items:end
}
.top h2{margin:0;color:var(--green);font-size:38px}
.top p{margin:8px 0 0;color:var(--muted);font-size:13px}

.add-button{
    padding:13px 19px;border:0;border-radius:11px;
    background:var(--green);color:#fff;font-weight:600
}
.add-button:hover{background:var(--pink)}

/* ФОРМА */

.form-panel{display:none;margin-bottom:30px;padding:28px;border-radius:18px}
.form-panel.open{display:block}
.form-panel h3{margin:0 0 24px}

.form-grid,.product-fields,.builder-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:18px
}
.product-fields{
    grid-column:1/-1;padding:20px;background:#faf9fa;border-radius:13px
}

.field{display:flex;flex-direction:column;gap:7px}
.full{grid-column:1/-1}

label{
    color:#777;font-size:11px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase
}
input,select,textarea{
    width:100%;padding:12px 13px;border:1px solid #d8d4d7;
    border-radius:9px;background:#fff;font:inherit;font-size:14px
}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}

.form-actions{margin-top:22px;display:flex;gap:10px}
.save,.cancel,.generate,.copy{
    padding:11px 17px;border-radius:9px;font-weight:600
}
.save,.copy{border:0;background:var(--pink);color:#fff}
.cancel{border:1px solid var(--line);background:#fff;color:#666}
.generate{border:1px solid var(--pink);background:#fff;color:var(--pink)}

/* СТАТИСТИКА */

.stats{
    margin-bottom:32px;display:grid;
    grid-template-columns:repeat(4,1fr);gap:14px
}
.stat{padding:18px;border-radius:14px;text-align:left}
.stat-number{color:var(--green);font-size:27px;font-weight:700}
.stat-label{margin-top:4px;color:var(--muted);font-size:11px}

.stats-button{font-family:inherit;transition:.18s}
.stats-button:hover{border-color:var(--pink);transform:translateY(-2px)}
.stats-button .stat-number{color:var(--pink)}

/* ЗАКАЗЫ */

.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.order-card{position:relative;padding:21px;border-radius:16px}

.order-card.active{
    border-color:rgba(212,0,126,.28);
    box-shadow:0 5px 22px rgba(212,0,126,.05)
}
.order-card.active::before{
    content:"";position:absolute;top:-1px;left:22px;
    width:38px;height:3px;background:var(--pink);border-radius:0 0 5px 5px
}

.order-head{display:flex;justify-content:space-between}
.shop{color:var(--pink);font-size:10px;font-weight:700;letter-spacing:1px}
.price{color:var(--green);font-weight:700}

.collection-name{
    margin-top:16px;color:#999;font-size:10px;
    font-weight:600;letter-spacing:1px;text-transform:uppercase
}
.order-card h3{margin:5px 0;font-size:18px}
.recipient{color:#777;font-size:13px}

.note{
    margin-top:14px;padding:11px 12px;background:var(--soft);
    border-radius:9px;color:#666;font-size:12px;line-height:1.5
}
.meta{
    margin-top:17px;display:flex;justify-content:space-between;
    gap:10px;color:#999;font-size:11px
}

.order-actions{
    margin-top:17px;padding-top:14px;border-top:1px solid #eee;
    display:flex;align-items:center;gap:8px
}
.order-actions select{width:auto;margin-left:auto;padding:7px 8px;font-size:11px}

.build{
    padding:8px 11px;border:1px solid var(--pink);
    border-radius:8px;background:#fff;color:var(--pink);
    font-size:11px;font-weight:600
}
.build:hover{background:var(--pink);color:#fff}

.delete{border:0;background:none;color:#aaa;font-size:11px}
.delete:hover{color:var(--pink)}

/* АРХИВ */

.archive{margin-top:75px}
.archive-heading{
    margin-bottom:28px;display:flex;align-items:center;gap:16px
}
.archive-heading h3{
    margin:0;color:#999;font-size:11px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase
}
.archive-line{height:1px;flex:1;background:var(--line)}
.archive-count{color:#aaa;font-size:11px}
.archive .order-card{opacity:.68}
.archive .order-card:hover{opacity:1}
.empty{grid-column:1/-1;padding:60px;text-align:center;color:#aaa}

/* BUILDER */

.modal{
    display:none;position:fixed;inset:0;z-index:1000;
    background:rgba(20,20,20,.42);padding:30px;
    align-items:center;justify-content:center
}
.modal.open{display:flex}

.modal-box{
    width:min(900px,100%);max-height:90vh;overflow:auto;
    padding:30px;border-radius:20px;
    box-shadow:0 25px 80px rgba(0,0,0,.18)
}
.modal-head{
    display:flex;justify-content:space-between;
    align-items:flex-start;margin-bottom:25px
}
.modal-head h2{margin:0;color:var(--green);font-size:25px}
.modal-sub{margin-top:6px;color:#888;font-size:12px}
.close{border:0;background:none;color:#aaa;font-size:25px}

.builder-note{
    grid-column:1/-1;padding:15px;background:var(--soft);
    border-radius:11px;color:#666;font-size:13px;line-height:1.6
}
.builder-note strong{
    display:block;margin-bottom:5px;color:#999;
    font-size:10px;letter-spacing:1px;text-transform:uppercase
}

.bb-result{grid-column:1/-1}
.bb-result textarea{
    min-height:300px;font-family:monospace;font-size:12px;line-height:1.5
}
.builder-actions{
    grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px
}

/* TOAST */

.toast{
    position:fixed;left:50%;bottom:30px;z-index:2000;
    padding:11px 17px;border-radius:30px;background:#171717;color:#fff;
    font-size:12px;font-weight:600;opacity:0;pointer-events:none;
    transform:translate(-50%,15px);transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
    .orders{grid-template-columns:repeat(2,1fr)}
    .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
    .page{padding:12px}
    .form-grid,.product-fields,.builder-grid,.orders{grid-template-columns:1fr}
    .modal{padding:12px}
}
</style>
</head>

<body>

<div class="page">

<header class="header">
    <h1 class="logo">Ananel Manager</h1>
    <a class="back" href="../">← Workspace</a>
</header>

<div class="top">
    <div>
        <h2>Заказы</h2>
        <p>SÓLE · EXTRA</p>
    </div>
    <button class="add-button" onclick="toggleForm()">+ Новый заказ</button>
</div>

<!-- НОВЫЙ ЗАКАЗ -->

<div id="form-panel" class="form-panel">
<h3>Новый заказ</h3>

<div class="form-grid">

    <div class="field">
        <label>Магазин</label>
        <select id="shop" onchange="loadCollections()">
            <option value="">Выберите магазин</option>
        </select>
    </div>

    <div class="field">
        <label>Сумма</label>
        <input
            id="price"
            type="number"
            min="0"
            placeholder="Подставится автоматически">
    </div>

    <div class="field">
        <label>Заказчик</label>
        <input
            id="customer"
            type="text"
            placeholder="Кто оформил заказ">
    </div>

    <div class="field">
        <label>Получатель</label>
        <input
            id="recipient"
            type="text"
            placeholder="Кому доставить заказ">
    </div>

    <div class="product-fields">

        <div class="field">
            <label>Коллекция</label>
            <select id="collection" onchange="loadModels()">
                <option value="">Выберите коллекцию</option>
            </select>
        </div>

        <div class="field">
            <label>Модель</label>
            <select id="model" onchange="fillPrice()">
                <option value="">Выберите модель</option>
            </select>
        </div>

    </div>

    <div class="field">
        <label>Куда доставить</label>
        <select id="delivery">
            <option value="Хогсмид">Хогсмид</option>
            <option value="ГФ">ГФ</option>
        </select>
    </div>

    <div class="field">
        <label>Дата заказа</label>
        <input id="date" type="date">
    </div>

    <div class="field full">
        <label>Записка получателю</label>
        <textarea
            id="gift-note"
            placeholder="Текст записки. Если записки нет — оставить пустым"></textarea>
    </div>

    <div class="field full">
        <label>Мои пометки</label>
        <textarea
            id="private-notes"
            placeholder="Внутренние заметки: что учесть, что проверить, особенности заказа"></textarea>
    </div>

</div>

<div class="form-actions">

    <button class="save" onclick="saveOrder()">
        Сохранить заказ
    </button>

    <button class="cancel" onclick="toggleForm(false)">
        Отмена
    </button>

</div>
</div>

<!-- СТАТИСТИКА -->

<div class="stats">

    <div class="stat">
        <div id="new-count" class="stat-number">0</div>
        <div class="stat-label">Новые</div>
    </div>

    <div class="stat">
        <div id="delivered-count" class="stat-number">0</div>
        <div class="stat-label">Доставлено</div>
    </div>

    <div class="stat">
        <div id="cancelled-count" class="stat-number">0</div>
        <div class="stat-label">Отменено</div>
    </div>

    <button class="stat stats-button" onclick="openStatistics()">
        <div class="stat-number">↗</div>
        <div class="stat-label">Статистика продаж</div>
    </button>

</div>

<div id="orders" class="orders"></div>

<section id="archive-section" class="archive">
    <div class="archive-heading">
        <h3>Архив</h3>
        <div class="archive-line"></div>
        <span id="archive-count" class="archive-count"></span>
    </div>
    <div id="archive-orders" class="orders"></div>
</section>

</div>

<!-- BBCODE BUILDER -->

<div id="builder" class="modal">
<div class="modal-box">

    <div class="modal-head">
        <div>
            <h2>Собрать заказ</h2>
            <div id="builder-sub" class="modal-sub"></div>
        </div>
        <button class="close" onclick="closeBuilder()">×</button>
    </div>

    <div class="builder-grid">

        <div id="builder-note" class="builder-note"></div>

        <div id="sender-field" class="field">
            <label>ID заказчика</label>
            <input id="sender-id" placeholder="2181">
        </div>

        <div class="field">
            <label>ID получателя</label>
            <input id="recipient-id" placeholder="3511">
        </div>

        <div class="field full">
            <label>Карточка</label>
            <select id="has-card">
                <option value="yes">С карточкой</option>
                <option value="no">Без карточки</option>
            </select>
        </div>

        <div class="builder-actions">
            <button class="generate" onclick="generateBBCode()">Сформировать</button>
            <button class="copy" onclick="copyBBCode()">Скопировать BBCode</button>
        </div>

        <div class="field bb-result">
            <label>Готовый BBCode</label>
            <textarea id="bbcode"></textarea>
        </div>

    </div>

</div>
</div>

<div id="toast" class="toast">BBCode скопирован</div>

<script src="../data/products.js"></script>

<script>
const $=id=>document.getElementById(id);
const statuses=["Новый","Доставлен","Отменён"];

const HOST="https://ananelcoval.github.io/ananel-hosting";
const HEADER="https://s10.iimage.su/s/07/uMWS4r2xp376YQgg6CQyNc6ytSzzruqy0BIyMWOSh.jpg";
const ORDER_URL="https://hogsmeade.dhog.org/viewtopic.php?t=743&";

let orders=JSON.parse(localStorage.getItem("ananelOrders"))||[];
let builderOrder=null;

/* СТАРЫЕ СТАТУСЫ */

orders.forEach(o=>{
    if(!statuses.includes(o.status))o.status="Новый";
});
saveOrders();

/* КАТАЛОГ */

function initCatalog(){
    $("shop").innerHTML=Object.entries(STORES)
        .map(([key,s])=>`<option value="${key}">${s.name}</option>`).join("");
    loadCollections();
}

function loadCollections(){
    const list=STORES[$("shop").value]?.collections||[];

    $("collection").innerHTML=list.length
        ?list.map(c=>`
            <option value="${c.id}">
                ${c.name}${c.available===false?" (архив)":""}
            </option>`).join("")
        :'<option value="">Нет коллекций</option>';

    loadModels();
}

function selectedCollection(){
    return STORES[$("shop").value]?.collections
        .find(c=>c.id===$("collection").value);
}

function selectedModel(){
    return selectedCollection()?.models?.[Number($("model").value)];
}

function loadModels(){
    const models=selectedCollection()?.models||[];

    $("model").innerHTML=models.length
        ?models.map((m,i)=>`<option value="${i}">${m.name}</option>`).join("")
        :'<option value="">Нет моделей</option>';

    fillPrice();
}

function fillPrice(){
    $("price").value=selectedModel()?.price??"";
}

/* ФОРМА */

function today(){
    return new Date().toISOString().split("T")[0];
}

$("date").value=today();
initCatalog();

function toggleForm(force){
    const form=$("form-panel");

    if(force===false){
        form.classList.remove("open");
        return;
    }

    form.classList.toggle("open");
}

function clearForm(){
    ["price","customer","recipient","gift-note","private-notes"]
        .forEach(id=>$(id).value="");

    $("date").value=today();
    $("shop").selectedIndex=0;
    loadCollections();
}

/* СОХРАНЕНИЕ ЗАКАЗА */

function saveOrder(){
    const storeKey=$("shop").value;
    const store=STORES[storeKey];
    const collection=selectedCollection();
    const model=selectedModel();

    if(!$("customer").value.trim()){
        alert("Укажи заказчика.");
        return;
    }

    if(!$("recipient").value.trim()){
        alert("Укажи получателя.");
        return;
    }

    if(!collection||!model){
        alert("Выбери коллекцию и модель.");
        return;
    }

    orders.unshift({
        id:Date.now(),
        storeKey,
        shop:store.name,

        customer:$("customer").value.trim(),
        recipient:$("recipient").value.trim(),

        price:Number($("price").value)||0,
        delivery:$("delivery").value,
        date:$("date").value,

        collectionId:collection.id,
        collection:collection.name,
        collectionFolder:collection.folder,

        modelFile:model.file,
        model:model.name,

        giftNote:$("gift-note").value.trim(),
        privateNotes:$("private-notes").value.trim(),

        status:"Новый"
    });

    saveOrders();
    clearForm();
    toggleForm(false);
    renderOrders();
}

/* STORAGE */

function saveOrders(){
    localStorage.setItem(
        "ananelOrders",
        JSON.stringify(orders)
    );
}

function changeStatus(id,status){
    const order=orders.find(o=>o.id===id);
    if(!order)return;

    order.status=status;
    saveOrders();
    renderOrders();
}

function deleteOrder(id){
    if(!confirm("Удалить этот заказ?"))return;

    orders=orders.filter(o=>o.id!==id);
    saveOrders();
    renderOrders();
}

/* СТАТИСТИКА — ПОКА ЗАГЛУШКА */

function openStatistics(){
    alert("Статистику продаж сделаем следующим разделом.");
}

/* =========================
   BBCODE BUILDER
========================= */

function isSelfOrder(order){
    return order.customer.trim().toLowerCase()===
           order.recipient.trim().toLowerCase();
}

function buildOrder(id){
    const order=orders.find(o=>o.id===id);
    if(!order)return;

    if(order.storeKey!=="sole"){
        alert("Для EXTRA шаблон доставки пока не настроен.");
        return;
    }

    builderOrder=order;

    const self=isSelfOrder(order);

    $("builder-sub").textContent=
        `${order.collection} · ${order.model}`;

    $("builder-note").innerHTML=`
        <strong>Записка для карточки</strong>
        ${order.giftNote||"Без записки"}
    `;

    /* Если заказ себе — ID отправителя не нужен */
    $("sender-field").style.display=self?"none":"flex";

    $("sender-id").value="";
    $("recipient-id").value="";
    $("has-card").value=order.giftNote?"yes":"no";
    $("bbcode").value="";

    $("builder").classList.add("open");
}

function closeBuilder(){
    $("builder").classList.remove("open");
    builderOrder=null;
}

function getBuilderData(){
    if(!builderOrder)return null;

    const store=STORES[builderOrder.storeKey];

    const collection=store?.collections.find(
        c=>c.id===builderOrder.collectionId
    );

    const model=collection?.models.find(
        m=>m.file===builderOrder.modelFile
    );

    if(!collection||!model)return null;

    return {
        order:builderOrder,
        collection,
        model
    };
}

/* СОЗДАНИЕ BBCODE */

function generateBBCode(){
    const data=getBuilderData();

    if(!data){
        alert("Не удалось найти данные модели.");
        return;
    }

    const {order,collection,model}=data;

    const self=isSelfOrder(order);
    const senderId=$("sender-id").value.trim();
    const recipientId=$("recipient-id").value.trim();
    const hasCard=$("has-card").value==="yes";

    if(!recipientId){
        alert("Укажи ID получателя.");
        return;
    }

    if(!self&&!senderId){
        alert("Укажи ID заказчика.");
        return;
    }

    const modelUrl=
        `${HOST}/sole/products/${collection.folder}/models/${model.file}`;

    const bagFile=
        collection.delivery?.bag || "base-bag.png";

    const bagUrl=
        `${HOST}/sole/products/${collection.folder}/decor/${bagFile}`;

    /* КТО КОМУ */

    const people=self
        ?`[b][left]Для:[/b] [mention=${recipientId}]${order.recipient}[/mention][/left]`
        :`[b][left]От: [/b][mention=${senderId}]${order.customer}[/mention]
[b]Для:[/b] [mention=${recipientId}]${order.recipient}[/mention][/left]`;

    /*
       С КАРТОЧКОЙ:
       оставляем заметное место, куда на форуме
       вставляется готовый attachment.
    */

    const productRow=hasCard
        ?`[tr][td]
[quote][size=100]${model.description}
[/size]
[/quote]
[td][width=300]<<< ВСТАВИТЬ КАРТОЧКУ >>>[/width]
[/tr]`
        :`[tr][td colspan=2]
[quote][size=100]${model.description}
[/size]
[/quote]
[/tr]`;

    const code=`[center][width=900][table][tr][td colspan=3][center][img]${HEADER}[/img][/center][/tr]
[tr][td]${people}
[td]
[center][size=110]Коллекция[/size]
[size=150][b]${order.collection}[/b][/size][/center]
[td v=middle h=right]Ателье открыто
для [b][url=${ORDER_URL}]новых заказов[/url]![/b][tr]

[tr][td colspan=3]
[center][width=400][img]${bagUrl}[/img][/width]

[more=Открыть пакет]

[center][width=800][table]
[tr][td colspan=2][size=210][b]${model.name}[/b][/size][/tr]
[tr][td colspan=2]
[size=120][color=#625c54]• ${model.type} •[/color][/size][/tr]
${productRow}
[tr][td colspan=2]
[center][width=400][img]${modelUrl}[/img][/width]
[/center][/td][/tr]
[/table][/center]

[/more]
[/center][/tr]
[/table][/width][/center]`;

    $("bbcode").value=code;
}

/* КОПИРОВАНИЕ */

function copyBBCode(){
    if(!$("bbcode").value){
        generateBBCode();
    }

    const code=$("bbcode").value;
    if(!code)return;

    navigator.clipboard.writeText(code)
        .then(showToast)
        .catch(()=>{
            alert("Не удалось скопировать BBCode.");
        });
}

function showToast(){
    const toast=$("toast");

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer=setTimeout(()=>{
        toast.classList.remove("show");
    },1500);
}

/* КЛИК ПО ФОНУ ЗАКРЫВАЕТ BUILDER */

$("builder").addEventListener("click",event=>{
    if(event.target===$("builder")){
        closeBuilder();
    }
});

/* =========================
   КАРТОЧКА ЗАКАЗА
========================= */

function orderCard(order,active){
    return `
        <article class="order-card ${active?"active":""}">

            <div class="order-head">
                <span class="shop">${order.shop}</span>
                <span class="price">${order.price||0} G</span>
            </div>

            <div class="collection-name">
                ${order.collection||""}
            </div>

            <h3>${order.model||"Без названия"}</h3>

            <div class="recipient">
                ${order.recipient
                    ?"Для: "+order.recipient
                    :"Для себя"}
            </div>

            ${order.giftNote?`
                <div class="note">
                    «${order.giftNote}»
                </div>
            `:""}

            ${order.privateNotes?`
                <div class="note">
                    <strong>Пометка:</strong>
                    ${order.privateNotes}
                </div>
            `:""}

            <div class="meta">
                <span>${order.customer}</span>
                <span>${order.delivery}</span>
                <span>${formatDate(order.date)}</span>
            </div>

            <div class="order-actions">

                ${active?`
                    <button
                        class="build"
                        onclick="buildOrder(${order.id})">
                        Собрать заказ
                    </button>
                `:""}

                <select onchange="changeStatus(${order.id},this.value)">
                    ${statuses.map(status=>`
                        <option
                            ${status===order.status?"selected":""}>
                            ${status}
                        </option>
                    `).join("")}
                </select>

                <button
                    class="delete"
                    onclick="deleteOrder(${order.id})">
                    Удалить
                </button>

            </div>

        </article>
    `;
}

/* =========================
   ВЫВОД
========================= */

function renderOrders(){
    const newest=(a,b)=>
        new Date(b.date||0)-new Date(a.date||0)
        || b.id-a.id;

    const active=orders
        .filter(o=>o.status==="Новый")
        .sort(newest);

    const archive=orders
        .filter(o=>
            o.status==="Доставлен" ||
            o.status==="Отменён"
        )
        .sort(newest);

    $("orders").innerHTML=active.length
        ?active.map(o=>orderCard(o,true)).join("")
        :'<div class="empty">Активных заказов нет.</div>';

    if(archive.length){
        $("archive-section").style.display="block";
        $("archive-count").textContent=archive.length;

        $("archive-orders").innerHTML=
            archive
                .map(o=>orderCard(o,false))
                .join("");
    }else{
        $("archive-section").style.display="none";
    }

    updateStats();
}

function formatDate(date){
    if(!date)return"";

    return new Date(date+"T00:00:00")
        .toLocaleDateString("ru-RU");
}

/* СЧЁТЧИКИ */

function updateStats(){
    $("new-count").textContent=
        orders.filter(o=>o.status==="Новый").length;

    $("delivered-count").textContent=
        orders.filter(o=>o.status==="Доставлен").length;

    $("cancelled-count").textContent=
        orders.filter(o=>o.status==="Отменён").length;
}

/* START */

renderOrders();

</script>
</body>
</html>
